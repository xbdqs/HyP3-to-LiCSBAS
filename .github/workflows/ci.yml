name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-tests:
    name: Core tests (${{ matrix.os }}, Python 3.11)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package
        run: python -m pip install --upgrade pip && python -m pip install -e .
      - name: Environment check
        run: python check_env.py
      - name: Branch-cut regression
        run: python tests/test_look_vector_branchcut.py
      - name: Synthetic ZIP-stack test
        run: python tests/test_synthetic_zip_stack.py

  end-to-end:
    name: End-to-end scientific workflow (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package with plotting support
        run: python -m pip install --upgrade pip && python -m pip install -e ".[plot]"
      - name: End-to-end test
        run: python tests/test_end_to_end_crossplatform.py

